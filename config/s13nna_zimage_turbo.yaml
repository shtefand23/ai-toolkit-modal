---
job: "extension"
config:
  name: "s13nna_zimage_turbo"
  process:
    - type: "diffusion_trainer"
      training_folder: "/root/ai-toolkit/output"
      sqlite_db_path: "./aitk_db.db"
      device: "cuda"
      trigger_word: "s13nna"
      performance_log_every: 10
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
        conv: 16
        conv_alpha: 16
        lokr_full_rank: true
        lokr_factor: -1
        network_kwargs:
          ignore_if_contains: []
      save:
        dtype: "bf16"
        save_every: 250
        max_step_saves_to_keep: 4
        save_format: "diffusers"
        push_to_hub: false
      datasets:
        - folder_path: "/root/ai-toolkit/datasets/s13nna"
          mask_path: null
          mask_min_value: 0.1
          default_caption: ""
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          cache_latents_to_disk: false
          is_reg: false
          network_weight: 1
          resolution:
            - 512
            - 768
            - 1024
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 1
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 3000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "weighted"
        content_or_style: "balanced"
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: false
        lr: 0.0001
        ema_config:
          use_ema: false
          ema_decay: 0.99
        skip_first_sample: false
        force_first_sample: false
        disable_sampling: false
        dtype: "bf16"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "person"
        switch_boundary_every: 1
        loss_type: "mse"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "Tongyi-MAI/Z-Image-Turbo"
        quantize: true
        qtype: "qfloat8"
        quantize_te: false
        qtype_te: "qfloat8"
        arch: "zimage:turbo"
        low_vram: true
        model_kwargs: {}
        compile: false
        layer_offloading: false
        layer_offloading_text_encoder_percent: 1
        layer_offloading_transformer_percent: 1
        assistant_lora_path: "ostris/zimage_turbo_training_adapter/zimage_turbo_training_adapter_v2.safetensors"
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        samples:
          - prompt: "s13nna, full body photo, standing outdoors, back facing camera, looking over her shoulder slightly, natural lighting, casual outfit, realistic skin texture"
          - prompt: "s13nna, full body shot from behind, walking away on a city street, turning her head slightly, cinematic lighting, depth of field, street photography style"
          - prompt: "s13nna, fashion portrait, neutral expression, gray seamless background, medium shot, Rembrandt lighting, high detail skin, editorial photography"
          - prompt: "s13nna, candid photo sitting in a cafe, holding a coffee cup, soft natural light, slightly messy hair, realistic, 35mm film look"
          - prompt: "s13nna, standing at a bar at a nightclub, colored lights, smoke, dramatic shadows, holding a drink, wide angle lens, cinematic photography"
          - prompt: "s13nna, playing chess in a park, sunlight filtering through trees, relaxed expression, shallow depth of field, cinematic style"
          - prompt: "s13nna, detailed color pencil sketch at the beach, facing viewer, soft shading, freckles visible, artistic illustration style"
          - prompt: "s13nna, playing guitar on stage, singing, dramatic lighting, crowd in background, energetic pose, cinematic concert photography"
          - prompt: "s13nna, in a workshop building a wooden chair, wearing a knit sweater, hands visible, candid flash photography, realistic imperfections"
          - prompt: "s13nna, photographic character sheet with 5 panels: full body front view, full body back view, side profile, close-up headshot, dramatic pose, consistent lighting and identity"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 1
        sample_steps: 9
        num_frames: 1
        fps: 1
meta:
  name: "[name]"
  version: "1.0"
